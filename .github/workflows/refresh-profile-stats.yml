name: Refresh profile stats

on:
  schedule:
    - cron: "37 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-profile-stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Fetch GitHub stats and render the README assets
        env:
          GH_USERNAME: AatirNadim
          GH_STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
          GH_CONTRIBUTIONS_TOKEN: ${{ secrets.GH_CONTRIBUTIONS_TOKEN }}
        run: python scripts/generate_profile_stats.py

      - name: Commit refreshed stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/stats
          if git diff --cached --quiet; then
            echo "No profile stats changed."
            exit 0
          fi
          git commit -m "chore: refresh profile stats"
          git push

  <text x="42" y="48" fill="#9ba8c6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11px" font-weight="700">FUN FACT / AATIR</text>
  <text x="42" y="80" fill="#e5e8f4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15px">Any given day, either my genius is elemental or it is</text>
  <text x="42" y="105" fill="#de5b99" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15px">non-existent. There is no in between.</text>

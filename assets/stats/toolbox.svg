<svg xmlns="http://www.w3.org/2000/svg" width="720" height="228" viewBox="0 0 720 228" role="img" aria-labelledby="title desc">
  <title id="title">Aatir’s toolbox</title>
  <desc id="desc">Selected languages, backend and data tools, and systems and delivery tools.</desc>
  <rect width="720" height="228" rx="18" fill="#090d1d" />
  <rect x="1" y="1" width="718" height="226" rx="17" fill="none" stroke="#1d1f3f" />
  <text x="24" y="34" fill="#9ba8c6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12px" font-weight="700">TOOLBOX / SELECTED STACK</text>

  <text x="24" y="78" fill="#44aab5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10px" font-weight="700">LANGUAGES</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11px" fill="#e5e8f4">
    <rect x="142" y="58" width="54" height="30" rx="7" fill="#131127" stroke="#3074a2"/><text x="169" y="77" text-anchor="middle">Go</text>
    <rect x="204" y="58" width="100" height="30" rx="7" fill="#131127" stroke="#80509b"/><text x="254" y="77" text-anchor="middle">TypeScript</text>
    <rect x="312" y="58" width="108" height="30" rx="7" fill="#131127" stroke="#de5b99"/><text x="366" y="77" text-anchor="middle">JavaScript</text>
    <rect x="428" y="58" width="78" height="30" rx="7" fill="#131127" stroke="#44aab5"/><text x="467" y="77" text-anchor="middle">Python</text>
    <rect x="514" y="58" width="80" height="30" rx="7" fill="#131127" stroke="#80509b"/><text x="554" y="77" text-anchor="middle">C / C++</text>
  </g>

  <text x="24" y="128" fill="#de5b99" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10px" font-weight="700">BACKEND / DATA</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11px" fill="#e5e8f4">
    <rect x="142" y="108" width="80" height="30" rx="7" fill="#131127" stroke="#44aa82"/><text x="182" y="127" text-anchor="middle">Node.js</text>
    <rect x="230" y="108" width="72" height="30" rx="7" fill="#131127" stroke="#de5b99"/><text x="266" y="127" text-anchor="middle">NestJS</text>
    <rect x="310" y="108" width="116" height="30" rx="7" fill="#131127" stroke="#3074a2"/><text x="368" y="127" text-anchor="middle">PostgreSQL</text>
    <rect x="434" y="108" width="82" height="30" rx="7" fill="#131127" stroke="#80509b"/><text x="475" y="127" text-anchor="middle">GraphQL</text>
    <rect x="524" y="108" width="90" height="30" rx="7" fill="#131127" stroke="#de5b99"/><text x="569" y="127" text-anchor="middle">RabbitMQ</text>
  </g>

  <text x="24" y="178" fill="#80509b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10px" font-weight="700">SYSTEMS / DELIVERY</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11px" fill="#e5e8f4">
    <rect x="142" y="158" width="74" height="30" rx="7" fill="#131127" stroke="#3074a2"/><text x="179" y="177" text-anchor="middle">Docker</text>
    <rect x="224" y="158" width="64" height="30" rx="7" fill="#131127" stroke="#80509b"/><text x="256" y="177" text-anchor="middle">Linux</text>
    <rect x="296" y="158" width="128" height="30" rx="7" fill="#131127" stroke="#44aab5"/><text x="360" y="177" text-anchor="middle">GitHub Actions</text>
    <rect x="432" y="158" width="58" height="30" rx="7" fill="#131127" stroke="#de5b99"/><text x="461" y="177" text-anchor="middle">Git</text>
  </g>
</svg>

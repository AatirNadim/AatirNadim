<svg xmlns="http://www.w3.org/2000/svg" width="720" height="188" viewBox="0 0 720 188" role="img" aria-labelledby="title desc">
  <title id="title">Random quote</title>
  <desc id="desc">A randomly selected software engineering quote by Harold Abelson &amp; Gerald Jay Sussman, from Structure and Interpretation of Computer Programs.</desc>
  <rect width="720" height="188" rx="18" fill="#090d1d"/>
  <rect x="1" y="1" width="718" height="186" rx="17" fill="none" stroke="#1d1f3f"/>
  <path d="M26 42h26" stroke="#de5b99" stroke-width="3" stroke-linecap="round"/>
  <text x="24" y="70" fill="#9ba8c6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11px" font-weight="700">FIELD NOTE / RANDOM QUOTE</text>
  <text x="24" y="108" fill="#e5e8f4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15px" font-weight="500">“Programs must be written for people to read, and only”</text>
  <text x="24" y="133" fill="#e5e8f4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15px" font-weight="500">“incidentally for machines to execute.”</text>
  <text x="24" y="166" fill="#44aab5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11px" font-weight="400">— Harold Abelson &amp; Gerald Jay Sussman  ·  Structure and Interpretation of Computer Programs</text>
</svg>
